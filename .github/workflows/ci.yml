# CI: typecheck + tests + build en cada push/PR, para las dos apps del
# repo (bot en la raíz, dashboard en dashboard/). No depende de ningún
# secreto real: DATABASE_URL usa el mismo valor de mentira que ya usan los
# tests locales (ver dashboard/vitest.config.ts) — Prisma no conecta de
# verdad ni en los tests ni al compilar, solo necesita una URL con forma
# válida. Si algún día hace falta un secreto real aquí (p. ej. para un
# despliegue), se añade como GitHub Secret, nunca hardcodeado.
name: CI

on:
  push:
    branches: [main]
  pull_request:

# Cancela una ejecución en curso si llega un push nuevo a la misma rama/PR
# — no tiene sentido terminar de comprobar un commit ya superado.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DUMMY_DATABASE_URL: postgresql://user:pass@localhost:5432/test

jobs:
  bot:
    name: Bot (raíz)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}

  dashboard:
    name: Dashboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
        env:
          # El postinstall corre `prisma generate`: necesita la variable
          # definida (con forma válida), no una conexión real.
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm test
      - name: build
        run: npm run build
        env:
          DATABASE_URL: ${{ env.DUMMY_DATABASE_URL }}
